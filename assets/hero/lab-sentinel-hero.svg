<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Lab-Sentinel project hero</title>
  <desc id="desc">A bright cyan and violet edge-AI chip links phosphor material data to semiconductor wafers and packaging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041426"/><stop offset=".52" stop-color="#062f46"/><stop offset="1" stop-color="#17134b"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#38f7f3" stop-opacity=".7"/><stop offset=".45" stop-color="#00aeda" stop-opacity=".18"/><stop offset="1" stop-color="#00aeda" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb84d"/><stop offset=".48" stop-color="#39f5ef"/><stop offset="1" stop-color="#9b7cff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#69dfea" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="34" fill="url(#grid)"/>
  <circle cx="1160" cy="338" r="360" fill="url(#halo)" filter="url(#blur)"/>
  <path d="M70 595C330 488 512 650 760 526S1180 408 1536 500" fill="none" stroke="url(#line)" stroke-opacity=".28" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" fill="#fff">
    <text x="86" y="86" font-size="24" letter-spacing="5" fill="#6ff8f3">CIMC 2026 · INDUSTRIAL HARDWARE R&amp;D · PROBLEM 2</text>
    <text x="80" y="192" font-size="92" font-weight="800" letter-spacing="-2">Lab-Sentinel</text>
    <text x="84" y="252" font-size="32" font-weight="600" fill="#d9f9ff">面向集成电路材料的 GD32H759 单芯片边缘 AI 工艺智能系统</text>
    <text x="84" y="305" font-size="24" fill="#a7c9d5">Near-infrared phosphor sintering as the real validation carrier</text>
    <g transform="translate(82 360)">
      <rect width="242" height="72" rx="20" fill="url(#glass)" stroke="#ffc46b" stroke-opacity=".55"/>
      <text x="22" y="29" font-size="17" fill="#ffd69a">NATIONAL PRELIMINARY</text><text x="22" y="56" font-size="25" font-weight="800">全国初赛特等奖</text>
      <rect x="260" width="242" height="72" rx="20" fill="url(#glass)" stroke="#8fbcff" stroke-opacity=".62"/>
      <text x="282" y="29" font-size="17" fill="#bcd5ff">NATIONAL FINALS</text><text x="282" y="56" font-size="25" font-weight="800">全国决赛国家二等奖</text>
    </g>
    <text x="84" y="499" font-size="22" fill="#8ce8e8">真实材料为锚 · 国产 MCU 为核 · 可验证方法为桥</text>
    <text x="84" y="548" font-size="19" fill="#91aebb">30 BOARD runtime assets / 28 logical models · 170 layered HOST research assets · AI authority = 0</text>
  </g>
  <g transform="translate(980 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="340" rx="62" fill="#071d31" stroke="#57f6f1" stroke-width="4"/>
    <rect x="35" y="35" width="270" height="270" rx="42" fill="url(#glass)" stroke="#9ffdfa" stroke-opacity=".6"/>
    <g stroke="#58f4ef" stroke-width="5" stroke-linecap="round">
      <path d="M40 82H-45M40 135H-64M40 205H-64M40 258H-45M300 82H385M300 135H404M300 205H404M300 258H385M82 40V-45M135 40V-64M205 40V-64M258 40V-45M82 300V385M135 300V404M205 300V404M258 300V385"/>
    </g>
    <circle cx="170" cy="170" r="91" fill="#062a3c" stroke="url(#line)" stroke-width="6"/>
    <text x="170" y="158" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#fff">GD32H759</text>
    <text x="170" y="193" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="20" fill="#70f8f2">Cortex-M7 · 600 MHz</text>
    <text x="170" y="221" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" fill="#a7c9d5">NO NPU</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M880 330H780C735 330 735 388 690 388H625" stroke="#ffbd59" stroke-width="4"/>
    <path d="M1325 330h80c50 0 50 55 96 55h36" stroke="#a58bff" stroke-width="4"/>
    <circle cx="880" cy="330" r="7" fill="#ffbd59"/><circle cx="1325" cy="330" r="7" fill="#a58bff"/>
  </g>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="18" font-weight="700">
    <text x="650" y="369" fill="#ffc96f">PHOSPHOR · PL/XRD</text>
    <text x="1360" y="367" fill="#bca8ff">SEM · METROLOGY · PACKAGING</text>
  </g>
  <text x="1518" y="684" text-anchor="end" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#68899a">OPEN-SOURCE ARCHIVAL RELEASE · v1.0</text>
</svg>


name: release-asset-integrity

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v1.0.2
      release_id:
        description: Optional draft Release ID for pre-publication verification
        required: false
        default: ""

# GitHub hides draft releases from installation tokens that only have
# contents:read. This workflow is restricted to maintainer-triggered dispatches
# and release publication events, and all API operations below remain read-only.
permissions:
  contents: write

concurrency:
  group: release-asset-integrity-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir dist
          if [[ -z "${RELEASE_ID}" ]]; then
            RELEASE_ID="$(
              gh api "/repos/${REPOSITORY}/releases?per_page=100" |
                jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' |
                head -n 1
            )"
          fi
          if [[ -z "${RELEASE_ID}" ]]; then
            echo "::error::Release not found; pass the draft release_id for pre-publication verification"
            exit 1
          fi

          assets_json="${RUNNER_TEMP}/release-assets.json"
          gh api "/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > "${assets_json}"
          jq -e 'length > 0 and all(.[]; .state == "uploaded")' "${assets_json}" > /dev/null

          while IFS=$'\t' read -r asset_id name expected_size expected_digest; do
            [[ "${name}" != */* && "${name}" != *\\* && "${name}" != "." && "${name}" != ".." ]]
            gh api \
              --header 'Accept: application/octet-stream' \
              "/repos/${REPOSITORY}/releases/assets/${asset_id}" > "dist/${name}"
            actual_size="$(stat --format='%s' "dist/${name}")"
            actual_digest="sha256:$(sha256sum "dist/${name}" | cut -d ' ' -f 1)"
            test "${actual_size}" = "${expected_size}"
            test "${actual_digest}" = "${expected_digest}"
          done < <(jq -r '.[] | [.id, .name, .size, .digest] | @tsv' "${assets_json}")
      - name: Verify SHA-256 manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          test -f dist/SHA256SUMS.txt
          anchor="release-manifests/${RELEASE_TAG}/SHA256SUMS.txt.sha256"
          test -f "${anchor}"
          cd dist
          sha256sum --check --strict "../${anchor}"
          python3 - <<'PY'
          import pathlib
          import re
          import os
          import hashlib
          import json
          import zipfile

          root = pathlib.Path(".")
          manifest = root / "SHA256SUMS.txt"
          def sha256_path(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          pattern = re.compile(r"^([0-9a-f]{64})  ([^/\\\x00-\x1f]+)$")
          names = []
          for lineno, line in enumerate(manifest.read_text(encoding="utf-8").splitlines(), 1):
              match = pattern.fullmatch(line)
              if not match:
                  raise SystemExit(f"invalid SHA256SUMS line {lineno}")
              name = match.group(2)
              if name in {".", "..", "SHA256SUMS.txt"}:
                  raise SystemExit(f"forbidden manifest name: {name}")
              names.append(name)
          if len(names) != len(set(names)):
              raise SystemExit("duplicate filename in SHA256SUMS.txt")
          actual = {p.name for p in root.iterdir() if p.is_file() and p.name != "SHA256SUMS.txt"}
          expected = set(names)
          chapter_assets = {
              "01-process-profile-and-ai-state.mp4",
              "01-process-profile-and-ai-state-cover.webp",
              "02-hardware-sensors-and-safety.mp4",
              "02-hardware-sensors-and-safety-cover.webp",
              "03-camera-and-vision-pipeline.mp4",
              "03-camera-and-vision-pipeline-cover.webp",
              "04-edge-lm-and-mcu-inference.mp4",
              "04-edge-lm-and-mcu-inference-cover.webp",
              "05-control-telemetry-and-closeout.mp4",
              "05-control-telemetry-and-closeout-cover.webp",
              "MEDIA_MANIFEST.md",
          }
          policies = {
              "v1.0.1": chapter_assets | {
                  "lab-sentinel-cimc2026-technical-evidence-v1.0.1.zip",
                  "lab-sentinel-cimc2026-technical-evidence-v1.0.1.zip.sha256",
              },
              "v1.0.2": chapter_assets | {
                  "00-full-demo-privacy-sanitized.mp4",
                  "team-photo-sanitized.webp",
                  "lab-sentinel-original-media-sources-privacy-sensitive-v1.0.2.zip",
                  "lab-sentinel-original-media-sources-privacy-sensitive-v1.0.2.zip.sha256",
              },
          }
          release_tag = os.environ.get("RELEASE_TAG", "")
          if release_tag not in policies:
              raise SystemExit(f"unsupported release tag: {release_tag}")
          policy = policies[release_tag]
          if len(names) != len(policy) or expected != policy:
              raise SystemExit(
                  f"release policy mismatch: count={len(names)} "
                  f"missing={sorted(policy - expected)} extra={sorted(expected - policy)}"
              )
          if actual != expected:
              raise SystemExit(
                  f"release asset set mismatch: missing={sorted(expected - actual)} "
                  f"extra={sorted(actual - expected)}"
              )

          privacy_markers = (
              b"+40.2468",
              b"116.1426",
              b"location",
              b"xiaomi",
              b"redmi",
              b"android",
              b"creation_time",
          )
          for name in sorted(expected):
              suffix = pathlib.Path(name).suffix.lower()
              if suffix not in {".mp4", ".webp"}:
                  continue
              payload = (root / name).read_bytes()
              lowered = payload.lower()
              hits = [marker.decode("ascii") for marker in privacy_markers if marker.lower() in lowered]
              if hits:
                  raise SystemExit(f"privacy metadata marker in {name}: {hits}")
              if suffix == ".webp":
                  upper = payload.upper()
                  if b"EXIF" in upper or b"XMP " in upper:
                      raise SystemExit(f"embedded metadata chunk in {name}")

          if release_tag == "v1.0.2":
              asset_contract = json.loads(
                  pathlib.Path("../release-manifests/v1.0.2/RELEASE_ASSETS.json").read_text(
                      encoding="utf-8"
                  )
              )
              contract_assets = asset_contract.get("assets", [])
              contract_names = [item["name"] for item in contract_assets]
              all_downloaded = {p.name for p in root.iterdir() if p.is_file()}
              if asset_contract.get("tag") != release_tag:
                  raise SystemExit("release asset contract tag mismatch")
              if len(contract_names) != len(set(contract_names)):
                  raise SystemExit("duplicate name in release asset contract")
              if set(contract_names) != all_downloaded:
                  raise SystemExit(
                      "release asset contract set mismatch: "
                      f"missing={sorted(set(contract_names) - all_downloaded)} "
                      f"extra={sorted(all_downloaded - set(contract_names))}"
                  )
              for item in contract_assets:
                  asset_path = root / item["name"]
                  if asset_path.stat().st_size != item["bytes"]:
                      raise SystemExit(f"release asset contract size mismatch: {item['name']}")
                  if sha256_path(asset_path) != item["sha256"]:
                      raise SystemExit(f"release asset contract digest mismatch: {item['name']}")

              archive_path = root / "lab-sentinel-original-media-sources-privacy-sensitive-v1.0.2.zip"
              original_names = {
                  "1787058624071.jpg",
                  "1787058624036.jpg",
                  "1787058655297.jpg",
                  "VID_20260815_170648.mp4",
                  "Creation_Image_1786802492467_1.png",
                  "1786800365415.jpg",
                  "1786800365428.jpg",
              }
              expected_members = {
                  "README_FIRST.md",
                  "ORIGINAL_MEDIA_MANIFEST.json",
                  *(f"originals/{name}" for name in original_names),
              }
              with zipfile.ZipFile(archive_path, "r") as archive:
                  if archive.testzip() is not None:
                      raise SystemExit("privacy-sensitive archive CRC failure")
                  actual_members = set(archive.namelist())
                  if actual_members != expected_members:
                      raise SystemExit(
                          "privacy-sensitive archive member mismatch: "
                          f"missing={sorted(expected_members - actual_members)} "
                          f"extra={sorted(actual_members - expected_members)}"
                      )
                  warning = archive.read("README_FIRST.md").decode("utf-8")
                  if "privacy-sensitive" not in warning or "precise location" not in warning:
                      raise SystemExit("privacy-sensitive archive warning is incomplete")
                  inner_manifest = json.loads(archive.read("ORIGINAL_MEDIA_MANIFEST.json"))
                  records = inner_manifest.get("files", [])
                  if len(records) != 7:
                      raise SystemExit("privacy-sensitive archive manifest count mismatch")
                  for record in records:
                      member = record["archive_path"]
                      info = archive.getinfo(member)
                      if info.file_size != record["bytes"]:
                          raise SystemExit(f"privacy-sensitive archive size mismatch: {member}")
                      digest = hashlib.sha256()
                      with archive.open(info, "r") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      if digest.hexdigest() != record["sha256"]:
                          raise SystemExit(f"privacy-sensitive archive digest mismatch: {member}")
          PY
          sha256sum --check --strict SHA256SUMS.txt
          if [[ "${RELEASE_TAG}" == "v1.0.1" ]]; then
            sha256sum --check --strict lab-sentinel-cimc2026-technical-evidence-v1.0.1.zip.sha256
          elif [[ "${RELEASE_TAG}" == "v1.0.2" ]]; then
            sha256sum --check --strict lab-sentinel-original-media-sources-privacy-sensitive-v1.0.2.zip.sha256
          fi

name: New model task proposal
description: Propose a source-bound, authority-zero model task
title: "[model] "
labels: [model, evidence-needed]
body:
  - type: textarea
    id: task
    attributes:
      label: Task contract and industrial decision
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data source, license, labels and split
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline, acceptance metric and failure mode
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundary
      options:
        - label: The proposed model has authority=0 and cannot directly actuate hardware.
          required: true

